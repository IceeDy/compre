services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: compre
      POSTGRES_USER: compre
      POSTGRES_PASSWORD: compre
    ports:
      - "5432:5432"
    volumes:
      - compre_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compre -d compre"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://compre:compre@db:5432/compre
      JWT_SECRET: change-me-in-development
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  compre_pgdata:
