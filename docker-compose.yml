services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: compre
      POSTGRES_USER: compre
      POSTGRES_PASSWORD: compre
    ports:
      - "5432:5432"
    volumes:
      - compre_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compre -d compre"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  compre_pgdata:
